<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00a3b4" />
  <title>SCE Bets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- AUTH -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo-wrap">
      <div class="auth-logo">Bets</div>
      <div class="auth-sce-logo">SCE</div>
    </div>
    <p class="auth-tagline">תודה שבאתם</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">כניסה</button>
      <button class="auth-tab" onclick="switchTab('register')">הרשמה</button>
    </div>
    <div id="login-form">
      <input type="text" id="login-username" placeholder="שם משתמש" class="auth-input" autocomplete="username" />
      <input type="password" id="login-password" placeholder="סיסמה" class="auth-input" autocomplete="current-password" />
      <button class="auth-btn" onclick="login()">כניסה</button>
    </div>
    <div id="register-form" style="display:none">
      <input type="text" id="reg-username" placeholder="שם משתמש" class="auth-input" autocomplete="username" />
      <input type="text" id="reg-display" placeholder="שם תצוגה" class="auth-input" autocomplete="name" />
      <input type="password" id="reg-password" placeholder="סיסמה" class="auth-input" autocomplete="new-password" />
      <button class="auth-btn" onclick="register()">הרשמה — קבל 1,000 נק"ז</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <nav class="navbar">
    <div class="nav-logo-wrap">
      <div class="nav-logo">Bets</div>
      <div class="nav-sce-badge">SCE</div>
    </div>
    <div class="nav-center">
      <button class="nav-tab active" onclick="showSection('markets',this)">שוק</button>
      <button class="nav-tab" onclick="showSection('portfolio',this)">הימורים שלי</button>
      <button class="nav-tab" onclick="showSection('leaderboard',this)">טבלה</button>
      <button class="nav-tab" id="admin-tab" onclick="showSection('admin',this)" style="display:none">ניהול</button>
    </div>
    <div class="nav-right">
      <div class="balance-chip">
        <span id="nav-balance">—</span>
        <span class="balance-label">נק"ז</span>
      </div>
      <div class="user-chip" id="nav-username">—</div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="עבור בין מצבי תצוגה"></button>
      <button class="logout-btn" onclick="logout()">יציאה</button>
    </div>
  </nav>

  <!-- MOBILE BOTTOM TABS -->
  <div class="mobile-tabs">
    <button class="mobile-tab active" onclick="showSection('markets',this);setMobileTab(this)">
      <span class="mtab-icon">📊</span>שוק
    </button>
    <button class="mobile-tab" onclick="showSection('portfolio',this);setMobileTab(this)">
      <span class="mtab-icon">📋</span>שלי
    </button>
    <button class="mobile-tab" onclick="showSection('leaderboard',this);setMobileTab(this)">
      <span class="mtab-icon">🏆</span>טבלה
    </button>
    <button class="mobile-tab" id="mobile-admin-tab" onclick="showSection('admin',this);setMobileTab(this)" style="display:none">
      <span class="mtab-icon">⚙️</span>ניהול
    </button>
  </div>

  <section id="section-markets" class="section active">
    <div class="section-header">
      <h1>שאלות פתוחות</h1>
      <p class="section-sub">הימר על מה שאתה בטוח בו</p>
    </div>
    <div id="markets-grid" class="markets-grid"></div>
  </section>

  <section id="section-portfolio" class="section">
    <div class="section-header">
      <h1>הימורים שלי</h1>
      <p class="section-sub">מעקב אחרי ההימורים הפעילים שלך</p>
    </div>
    <div id="portfolio-list" class="portfolio-list"></div>
  </section>

  <section id="section-leaderboard" class="section">
    <div class="section-header">
      <h1>טבלת מובילים</h1>
      <p class="section-sub">מי הכי חכם ב-SCE?</p>
    </div>
    <div id="leaderboard-list" class="leaderboard-list"></div>
  </section>

  <section id="section-admin" class="section">
    <div class="section-header">
      <h1>ניהול</h1>
      <p class="section-sub">יצירה וניהול שאלות</p>
    </div>
    <div class="admin-panel">
      <div class="admin-card">
        <h3>שאלה חדשה</h3>
        <input type="text" id="new-question-text" placeholder="טקסט השאלה..." class="admin-input" />
        <input type="text" id="new-question-category" placeholder="קטגוריה (הרצאות, בחינות...)" class="admin-input" />
        <label class="admin-date-label">תאריך סגירה <span class="optional-tag">אופציונלי</span></label>
        <input type="datetime-local" id="new-question-deadline" class="admin-input" />
        <label class="admin-date-label">אפשרויות בחירה</label>
        <div class="admin-options-row">
          <input type="text" id="new-option-yes" placeholder='אפשרות "כן" (ברירת מחדל: כן)' class="admin-input admin-opt-input" />
          <input type="text" id="new-option-no"  placeholder='אפשרות "לא" (ברירת מחדל: לא)' class="admin-input admin-opt-input" />
        </div>
        <button class="admin-btn" onclick="createQuestion()">צור שאלה</button>
      </div>
      <div class="admin-card">
        <h3>שאלות קיימות</h3>
        <div id="admin-questions-list"></div>
      </div>
    </div>
  </section>
</div>

<!-- BET MODAL -->
<div id="bet-modal" class="modal-overlay" onclick="closeBetModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeBetModal()">✕</button>
    <div id="modal-category-tag" class="modal-category"></div>
    <h2 id="modal-question-text"></h2>
    <div id="modal-deadline-info" class="modal-deadline"></div>
    <div class="modal-odds">
      <div class="odds-block yes">
        <div class="odds-label" id="modal-label-yes">כן</div>
        <div class="odds-val" id="modal-yes-pct">—%</div>
      </div>
      <div class="odds-block no">
        <div class="odds-label" id="modal-label-no">לא</div>
        <div class="odds-val" id="modal-no-pct">—%</div>
      </div>
    </div>
    <div class="bet-controls">
      <div class="bet-choice">
        <button class="choice-btn yes active" id="choice-yes" onclick="selectChoice('YES')">כן</button>
        <button class="choice-btn no" id="choice-no" onclick="selectChoice('NO')">לא</button>
      </div>
      <div class="bet-amount-row">
        <label>סכום</label>
        <div class="amount-input-wrap">
          <input type="number" id="bet-amount" min="10" step="10" value="100" class="bet-input" oninput="updatePayout()" inputmode="numeric" />
          <span class="amount-unit">נק"ז</span>
        </div>
      </div>
      <div class="bet-payout">
        <span>פוטנציאל רווח</span>
        <span id="bet-payout-val" class="payout-val">—</span>
      </div>
      <button class="place-bet-btn" onclick="placeBet()">הנח הימור</button>
    </div>
    <div id="modal-error" class="modal-error"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
